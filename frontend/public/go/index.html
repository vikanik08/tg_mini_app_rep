<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eee9f5">
  <meta name="robots" content="noindex,nofollow">
  <title>Открываем SmartPet</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#eee9f5;color:#30294e;font-family:Arial,sans-serif;letter-spacing:0;padding:24px}.panel{width:min(100%,400px);text-align:center}h1{font-size:28px;margin:0 0 12px}p{margin:0 0 24px;color:#766c8d;line-height:1.5}.spinner{width:38px;height:38px;margin:0 auto 24px;border:4px solid #d8cee9;border-top-color:#7657ad;border-radius:50%;animation:spin .8s linear infinite}a{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:0 20px;border-radius:8px;background:#7657ad;color:#fff;text-decoration:none;font-weight:700}a[hidden]{display:none}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
  </style>
</head>
<body>
  <main class="panel">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Открываем SmartPet</h1>
    <p id="status">Секунду, переходим в приложение.</p>
    <a id="continue" href="#" hidden>Продолжить</a>
  </main>
  <script>
    const counterId=112520314;
    const params=new URLSearchParams(location.search);
    const platform=(params.get('platform')||'').toLowerCase();
    const utmNames=['utm_source','utm_medium','utm_campaign','utm_content','utm_term'];
    const attribution=Object.fromEntries(utmNames.map(name=>[name,params.get(name)]).filter(([,value])=>Boolean(value)));

    function launchPart(value,maxLength,fallback){
      const normalized=(value||fallback).trim().toLowerCase().replace(/[^a-z0-9_-]+/g,'_').replace(/^_+|_+$/g,'');
      return (normalized||fallback).slice(0,maxLength);
    }

    const launchPayload=[
      'utm_'+launchPart(attribution.utm_source,20,'direct'),
      launchPart(attribution.utm_medium,16,'redirect'),
      launchPart(attribution.utm_campaign,24,'smartpet'),
      launchPart(attribution.utm_content,16,platform||'default'),
      launchPart(attribution.utm_term,16,'none')
    ].join('__');

    const destinations={
      telegram:'https://t.me/SmartPetHelper_bot?startapp='+encodeURIComponent(launchPayload),
      vk:'https://vk.ru/app54599546?ref='+encodeURIComponent(launchPayload)
    };
    const destination=destinations[platform];
    const status=document.querySelector('#status');
    const continueLink=document.querySelector('#continue');

    if(!destination){
      status.textContent='Не удалось определить приложение для перехода.';
      continueLink.href='/social';
      continueLink.textContent='Выбрать площадку';
      continueLink.hidden=false;
    }else{
      continueLink.href=destination;
      continueLink.hidden=false;
      let redirected=false;
      const redirect=()=>{
        if(redirected)return;
        redirected=true;
        location.replace(destination);
      };

      window.ym=window.ym||function(){(window.ym.a=window.ym.a||[]).push(arguments)};
      window.ym.l=Date.now();
      const tag=document.createElement('script');
      tag.async=true;
      tag.src='https://mc.yandex.ru/metrika/tag.js';
      document.head.append(tag);
      ym(counterId,'init',{clickmap:false,trackLinks:true,accurateTrackBounce:true});
      ym(counterId,'reachGoal','miniapp_redirect',{platform,...attribution},redirect);
      setTimeout(redirect,1800);
    }
  </script>
</body>
</html>
