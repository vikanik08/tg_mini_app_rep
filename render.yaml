databases:
  - name: tg-miniapp-db
    plan: free
    databaseName: tg_miniapp
    user: tg_miniapp

services:
  - type: web
    name: tg-miniapp-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_NAME
        value: TG MiniApp API
      - key: ENV
        value: prod
      - key: DEBUG
        value: false
      - key: ALLOW_DEV_LOGIN
        value: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALG
        value: HS256
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://tg-miniapp-sand.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: tg-miniapp-db
          property: connectionString
